<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Click Note - Email Verification</title>
  <!-- Fuentes Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link 
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Poppins:wght@400;600&display=swap" 
    rel="stylesheet"
  >
  <style>
    :root {
      --primary-color: #aa3bff;
      --secondary-color: #f7f7f7;
      --text-color: #333333;
      --font-poppins: 'Poppins', sans-serif;
      --font-plex: 'IBM Plex Mono', monospace;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: var(--font-poppins);
      background-color: var(--secondary-color);
      color: var(--text-color);
      line-height: 1.6;
    }
    .container {
      width: 90%;
      max-width: 600px;
      margin: 0 auto;
      text-align: center;
      margin-top: 80px;
      background-color: #fff;
      padding: 2em;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      animation: fadeIn 0.8s ease-in-out;
    }
    h2 {
      margin-top: 0;
      color: var(--primary-color);
      font-family: var(--font-plex);
      font-size: 1.8em;
      margin-bottom: 0.5em;
    }
    .checkmark {
      font-size: 3em;
      color: #28a745;
      margin-bottom: 20px;
    }
    p {
      margin-bottom: 20px;
      line-height: 1.5;
    }
    a.button {
      display: inline-block;
      padding: 1em 2em;
      background-color: var(--primary-color);
      color: #ffffff;
      text-decoration: none;
      border-radius: 5px;
      transition: 0.3s;
      font-weight: 600;
      font-family: var(--font-plex);
    }
    a.button:hover {
      background-color: #892de0;
    }
    @keyframes fadeIn {
      0% {
        opacity: 0;
        transform: translateY(10px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .lang-es { display: none; }
    .lang-en { display: none; }
  </style>
  
</head>

<body>
  <div class="container">
    <div class="checkmark">✔</div>
    <!-- ESPAÑOL -->
    <h2 class="lang-es">Correo Verificado</h2>
    <p class="lang-es">
      ¡Felicidades! Tu cuenta ha sido verificada correctamente. 
      Ahora puedes disfrutar de todas las funciones de <strong>Click Note</strong>.
    </p>
    <a class="button lang-es" href="index.html">Ir a Inicio</a>

    <!-- INGLÉS -->
    <h2 class="lang-en">Email Verified</h2>
    <p class="lang-en">
      Congratulations! Your account has been successfully verified. 
      You can now enjoy all the features of <strong>Click Note</strong>.
    </p>
    <a class="button lang-en" href="index.html">Go to Home</a>
  </div>

  <script>
    (function setLanguage() {
      let userLang = navigator.language || navigator.userLanguage;
      userLang = userLang.substring(0, 2).toLowerCase();

      if (userLang === 'es') {
        document.querySelectorAll('.lang-es').forEach(el => el.style.display = 'block');
        document.querySelectorAll('.lang-en').forEach(el => el.style.display = 'none');
      } else {
        document.querySelectorAll('.lang-en').forEach(el => el.style.display = 'block');
        document.querySelectorAll('.lang-es').forEach(el => el.style.display = 'none');
      }
    })();
  </script>
</body>
</html>
